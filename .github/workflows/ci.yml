name: Continuous Integration

# 1. Trigger the workflow on pushes or pull requests to your main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # JOB 1: Run Jest/Vitest automated tests directly on the runner for speed
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm' # Automatically caches node_modules dependencies for faster builds

      - name: Install Blueprinted Dependencies
        run: npm ci

      - name: Execute Automated Test Suite
        run: npm run test -- --run

  # JOB 2: Verify that the production Docker infrastructure compiles flawlessly
  build-docker:
    needs: run-tests # Only run this job if the test suite passes successfully
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3 # Enables modern Buildkit features in the cloud

      - name: Verify Production Dockerfile Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile.prod
          push: false # We only want to verify it compiles cleanly, not deploy it yet
          tags: quizzical:latest
          cache-from: type=gha # Uses GitHub Actions native cache for blazing-fast subsequent builds
          cache-to: type=gha,mode=max