name: React CI/CD to Netlify

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 1. TEST GATEKEEPER: Ensure no broken code gets deployed
      - name: Run React Test Suite
        run: npm run test -- --run

      # 2. COMPILE: Turn your React JSX components into plain HTML/CSS/JS
      - name: Build Production Bundle
        run: npm run build

      # 3. DEPLOY: Push the compiled build folder directly to Netlify's CDN
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          publish-dir: './dist'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}